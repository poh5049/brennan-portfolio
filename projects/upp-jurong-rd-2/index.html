<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Upp Jurong Rd — Brennan Phua Interior Designer"/>
<title>Upp Jurong Rd — Brennan Phua</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0e0d;--text:#d8d0c4;--text-dim:#6e6860;--gold:#8a7560;--ease:cubic-bezier(0.16,1,0.3,1)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-weight:300;overflow-x:hidden;cursor:none;-webkit-font-smoothing:antialiased}
::selection{background:rgba(138,117,96,.22);color:var(--text)}
#loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 1.4s var(--ease),visibility 1.4s}
#loader.gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-line{width:1px;height:0;background:var(--gold);animation:loaderGrow 1s var(--ease) .1s forwards}
@keyframes loaderGrow{to{height:60px}}
.cur{position:fixed;width:6px;height:6px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s var(--ease),height .3s var(--ease)}
.cur-r{position:fixed;width:32px;height:32px;border:1px solid rgba(138,117,96,.35);border-radius:50%;pointer-events:none;z-index:9997;transform:translate(-50%,-50%);transition:width .5s var(--ease),height .5s var(--ease),border-color .4s}
.cur.h{width:12px;height:12px;background:transparent;border:1px solid var(--gold)}
.cur-r.h{width:56px;height:56px;border-color:rgba(138,117,96,.12)}
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:36px 60px;transition:padding .7s var(--ease),background .7s,border-color .7s;border-bottom:1px solid transparent}
nav.s{padding:20px 60px;background:rgba(15,14,13,.92);backdrop-filter:blur(20px);border-color:rgba(138,117,96,.08)}
.nav-back{display:flex;align-items:center;gap:14px;font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;transition:color .4s;cursor:none}
.nav-back::before{content:'';width:24px;height:1px;background:currentColor;transition:width .4s var(--ease)}
.nav-back:hover{color:var(--text)}
.nav-back:hover::before{width:36px}
.nav-logo{font-size:10px;letter-spacing:.38em;text-transform:uppercase;color:var(--text);font-weight:400;text-decoration:none;transition:opacity .3s}
.nav-logo:hover{opacity:.55}
.proj-header{padding:180px 60px 80px;border-bottom:1px solid rgba(138,117,96,.08)}
.proj-type{font-size:7px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin-bottom:24px;opacity:0;animation:fu .9s var(--ease) .8s forwards}
.proj-title{font-size:clamp(40px,6vw,96px);font-weight:100;letter-spacing:.18em;text-transform:uppercase;line-height:1;color:var(--text);overflow:hidden;margin-bottom:40px}
.proj-title span{display:block;animation:lu 1.2s var(--ease) .95s both}
.proj-meta{display:flex;gap:60px;border-top:1px solid rgba(138,117,96,.1);padding-top:28px}
.meta-item .lbl{font-size:7px;letter-spacing:.44em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px}
.meta-item .val{font-size:9px;letter-spacing:.18em;color:var(--text)}
.proj-meta-wrap{opacity:0;animation:fu .9s var(--ease) 1.2s forwards}
.proj-featured{margin-top:28px;padding-top:28px;border-top:1px solid rgba(138,117,96,.1)}
.featured-lbl{font-size:7px;letter-spacing:.44em;text-transform:uppercase;color:var(--text-dim);margin-bottom:14px}
.featured-links{display:flex;gap:20px;flex-wrap:wrap}
.featured-link{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:8px;transition:color .3s}
.featured-link:hover{color:var(--text)}
.featured-link::before{content:attr(data-icon);font-size:10px}
.gallery{padding:4px 4px 120px}
.gallery-grid{columns:2;column-gap:4px}
.gallery-item{break-inside:avoid;margin-bottom:4px;overflow:hidden;cursor:none;position:relative;background:#1a1815}
.gallery-item img{width:100%;height:auto;display:block;filter:brightness(.88);transition:filter 1.3s var(--ease),transform 1.4s var(--ease);will-change:transform,filter}
.gallery-item:hover img{filter:brightness(1);transform:scale(1.03)}
.gallery-item{animation:gslide .8s cubic-bezier(0.16,1,0.3,1) both}
@keyframes gslide{from{transform:translateY(20px)}to{transform:translateY(0)}}
#lightbox{position:fixed;inset:0;z-index:500;background:rgba(10,9,8,.97);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s;cursor:none}
#lightbox.open{opacity:1;visibility:visible}
#lightbox img{max-width:92vw;max-height:90vh;object-fit:contain;transform:scale(.96);transition:transform .6s var(--ease);display:block}
#lightbox.open img{transform:scale(1)}
.lb-close{position:absolute;top:36px;right:48px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:none;opacity:.5;transition:opacity .3s;background:none;border:none}
.lb-close:hover{opacity:1}
.lb-close::before,.lb-close::after{content:'';position:absolute;width:22px;height:1px;background:var(--text)}
.lb-close::before{transform:rotate(45deg)}.lb-close::after{transform:rotate(-45deg)}
.lb-info{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .4s var(--ease) .3s;font-size:8px;letter-spacing:.3em;color:var(--text-dim);text-transform:uppercase;white-space:nowrap}
#lightbox.open .lb-info{opacity:1}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:80px;display:flex;align-items:center;justify-content:center;cursor:none;opacity:.3;transition:opacity .3s;background:none;border:none}
.lb-nav:hover{opacity:1}
.lb-nav::after{content:'';width:10px;height:10px;border-top:1px solid var(--text);border-right:1px solid var(--text)}
.lb-prev{left:24px}.lb-prev::after{transform:rotate(-135deg)}
.lb-next{right:24px}.lb-next::after{transform:rotate(45deg)}
.proj-footer{border-top:1px solid rgba(138,117,96,.08);display:grid;grid-template-columns:1fr 1fr}
.proj-nav-item{padding:56px 60px;display:flex;flex-direction:column;gap:12px;text-decoration:none;cursor:none;transition:background .4s;position:relative;overflow:hidden}
.proj-nav-item:first-child{border-right:1px solid rgba(138,117,96,.08)}
.proj-nav-item::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .6s var(--ease);transform-origin:left}
.proj-nav-item:hover::after{transform:scaleX(1)}
.proj-nav-label{font-size:7px;letter-spacing:.44em;text-transform:uppercase;color:var(--text-dim)}
.proj-nav-title{font-size:clamp(14px,2vw,22px);font-weight:100;letter-spacing:.16em;text-transform:uppercase;color:var(--text);transition:color .4s}
.proj-nav-item:hover .proj-nav-title{color:rgba(216,208,196,.65)}
footer{padding:24px 60px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(138,117,96,.08)}
.ft-l{font-size:7px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-dim)}
.ft-r{font-size:7px;letter-spacing:.22em;color:var(--text-dim)}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes lu{from{transform:translateY(110%)}to{transform:translateY(0)}}
@media(max-width:900px){
  nav{padding-left:28px;padding-right:28px;padding-top:28px}
  nav.s{padding-top:18px;padding-left:28px;padding-right:28px}
  .proj-header{padding:140px 28px 72px}
  .gallery{padding:4px 4px 80px}
  .proj-footer{grid-template-columns:1fr}
  .proj-nav-item:first-child{border-right:none;border-bottom:1px solid rgba(138,117,96,.08)}
  .proj-nav-item{padding:40px 28px}
  footer{padding:24px 28px}
  .proj-meta{gap:32px;flex-wrap:wrap}
}
@media(max-width:600px){.gallery-grid{columns:1}}
</style>
</head>
<body>
<div id="loader"><div class="loader-line"></div></div>
<div class="cur" id="cur"></div>
<div class="cur-r" id="curR"></div>
<div id="lightbox">
  <button class="lb-close" id="lbClose"></button>
  <button class="lb-nav lb-prev" id="lbPrev"></button>
  <img id="lbImg" src="" alt=""/>
  <button class="lb-nav lb-next" id="lbNext"></button>
  <p class="lb-info" id="lbInfo"></p>
</div>
<nav id="nav">
  <a class="nav-back" href="../../index.html">All Works</a>
  <a class="nav-logo" href="../../index.html">Brennan Phua</a>
</nav>
<section class="proj-header">
  <p class="proj-type">4 Room BTO</p>
  <h1 class="proj-title"><span>Upp Jurong Rd</span></h1>
  <div class="proj-meta-wrap">
    <div class="proj-meta">
      <div class="meta-item"><p class="lbl">Category</p><p class="val">4 Room BTO</p></div>
      <div class="meta-item"><p class="lbl">Location</p><p class="val">Singapore</p></div>
      <div class="meta-item"><p class="lbl">Photos</p><p class="val">9 Images</p></div>
    </div>

  </div>
</section>
<section class="gallery">
  <div class="gallery-grid">
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/4532a69d2adad8e60ac89997ec28cc58.jpg" width="1200" height="900" alt="" loading="eager" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/08e31701bce381d4d6c8a08c78d70e56.jpg" width="1280" height="720" alt="" loading="eager" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/b2995d816fbd19d4476390b5ffd5d0ee.jpg" width="1280" height="720" alt="" loading="eager" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/a620bc07b75f2f0b0d070b5e8c5fc5e9.jpg" width="1280" height="720" alt="" loading="eager" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/764d3481fc167b0f6fd1700737e4af5b.jpg" width="1280" height="720" alt="" loading="lazy" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/5908ee3f997138e8e100c608b71dc4bc.jpg" width="1280" height="720" alt="" loading="lazy" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/efa18478cec534c97f2918c2654e6e9e.jpg" width="1280" height="720" alt="" loading="lazy" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/077b479d2955af4ee35f14118ea3f7d4.jpg" width="1280" height="720" alt="" loading="lazy" decoding="async"/></div>
    <div class="gallery-item r"><img src="https://brennanp.my.canva.site/_assets/media/a397d8832c616efd3bf7f82385ea3cf8.jpg" width="1280" height="720" alt="" loading="lazy" decoding="async"/></div>
  </div>
</section>
<div class="proj-footer">
  <a class="proj-nav-item" href="../../index.html#works">
    <span class="proj-nav-label">&larr; Back</span>
    <span class="proj-nav-title">All Works</span>
  </a>
  <a class="proj-nav-item" href="mailto:brennan@sginterior.com.sg">
    <span class="proj-nav-label">Get in touch &rarr;</span>
    <span class="proj-nav-title">Start a Project</span>
  </a>
</div>
<footer>
  <p class="ft-l">Brennan Phua &middot; Interior Designer</p>
  <p class="ft-r">&copy; 2026 SG Interior Design</p>
</footer>
<script>
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('loader').classList.add('gone'),500));
const cur=document.getElementById('cur'),curR=document.getElementById('curR');
let mx=window.innerWidth/2,my=window.innerHeight/2,rx=mx,ry=my;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px'});
(function tick(){rx+=(mx-rx)*.075;ry+=(my-ry)*.075;curR.style.left=rx+'px';curR.style.top=ry+'px';requestAnimationFrame(tick)})();
document.querySelectorAll('a,button,.gallery-item').forEach(el=>{
  el.addEventListener('mouseenter',()=>{cur.classList.add('h');curR.classList.add('h')});
  el.addEventListener('mouseleave',()=>{cur.classList.remove('h');curR.classList.remove('h')});
});
window.addEventListener('scroll',()=>{
  const nav=document.getElementById('nav');
  nav.classList.toggle('s',window.scrollY>40);
});
const items=document.querySelectorAll('.gallery-item');
const lbEl=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
const lbInfo=document.getElementById('lbInfo');
const lbClose=document.getElementById('lbClose');
const lbPrev=document.getElementById('lbPrev');
const lbNext=document.getElementById('lbNext');
let cur_idx=0;
const srcs=[...items].map(el=>el.querySelector('img').src);
function openLb(i){cur_idx=i;lbImg.src=srcs[i];lbInfo.textContent=(i+1)+' / '+srcs.length;lbEl.classList.add('open');document.body.style.overflow='hidden'}
function closeLb(){lbEl.classList.remove('open');document.body.style.overflow=''}
function navLb(d){cur_idx=(cur_idx+d+srcs.length)%srcs.length;lbImg.src=srcs[cur_idx];lbInfo.textContent=(cur_idx+1)+' / '+srcs.length}
items.forEach((el,i)=>el.addEventListener('click',()=>openLb(i)));
lbClose.addEventListener('click',closeLb);
lbPrev.addEventListener('click',()=>navLb(-1));
lbNext.addEventListener('click',()=>navLb(1));
lbEl.addEventListener('click',e=>{if(e.target===lbEl)closeLb()});
document.addEventListener('keydown',e=>{if(!lbEl.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')navLb(-1);if(e.key==='ArrowRight')navLb(1)});
</script>
</body>
</html>
